plugins {
    id 'com.android.application'
}

// Login com Google / Leaderboard: só liga se o google-services.json do Firebase estiver em app/.
// Sem ele o app compila e funciona normalmente, só sem o Leaderboard.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// No GitHub Actions a chave vem do segredo ABYSS_DEBUG_KEYSTORE (a mesma chave de debug do PC),
// para o APK publicado ter sempre a mesma assinatura (senão a atualização automática não instala por cima).
def ciKeystore = System.getenv('ABYSS_KEYSTORE_FILE')

android {
    namespace 'com.abysshub.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abysshub.app'
        minSdk 26
        targetSdk 34
        versionCode 23
        versionName '2.1.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        ci {
            if (ciKeystore) {
                storeFile file(ciKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (ciKeystore) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            // Usa a chave de debug para o APK release já sair instalável (igual ao AbyssSub).
            signingConfig ciKeystore ? signingConfigs.ci : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A biblioteca Rust (libabysshub.so) é colocada aqui pelo build-android.ps1.
    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }

    lint { checkReleaseBuilds false }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.core:core:1.13.1'
}

// Depois de gerar, copia o APK para a pasta "APK" do projeto.
def apkDestino = new File(rootProject.projectDir.parentFile, 'APK')
def pastaBuild = layout.buildDirectory
['Debug', 'Release'].each { variante ->
    tasks.matching { it.name == "assemble${variante}" }.configureEach { t ->
        t.doLast {
            def origem = pastaBuild.dir("outputs/apk/${variante.toLowerCase()}").get().asFile
            apkDestino.mkdirs()
            origem.listFiles()?.findAll { it.name.endsWith('.apk') }?.each { f ->
                java.nio.file.Files.copy(f.toPath(),
                    new File(apkDestino, f.name.replace('app-', 'AbyssHub-')).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}
